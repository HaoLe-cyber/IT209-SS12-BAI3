name: CI/CD Multi-Environment Pipeline

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://api.staging.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        run: echo "Deploying to Staging Environment..."

      - name: Run Staging Deployment
        run: |
          echo "Application successfully deployed to Staging!"
          # Thêm các lệnh deploy thực tế tại đây (ví dụ: SSH, Docker, kubectl...)

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        run: echo "Deploying to Production Environment..."

      - name: Run Production Deployment
        run: |
          echo "Application successfully deployed to Production!"
          # Thêm các lệnh deploy thực tế tại đây